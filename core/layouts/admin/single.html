{{ define "main" }}
{{ partial "sidebar.html" (dict "context" . "disableSidebar" true "displayPlaceholder" false) }}
<div class="oa-shell">
  <h1 class="oa-page-title">{{ .Title }}</h1>
  <div class="oa-page-subtitle">{{ .Content }}</div>
  <section data-oa-protected-view="admin">
    <p class="oa-page-subtitle">{{ i18n "loadingProtectedContent" }}</p>
  </section>
</div>
{{ end }}
